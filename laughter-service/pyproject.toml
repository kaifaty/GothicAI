[project]
name = "gothic-laughter"
version = "0.1.0"
description = "HTTP laughter detection for the voice input service"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "httpx>=0.28.1",
    "numpy>=2.4.2",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.31.1; sys_platform == 'linux'"]
cpu = ["onnxruntime>=1.31.1"]

[project.scripts]
gothic-laughter = "gothic_laughter.cli:main"

[tool.uv]
conflicts = [[{ extra = "gpu" }, { extra = "cpu" }]]

[tool.uv.build-backend]
module-name = "gothic_laughter"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
