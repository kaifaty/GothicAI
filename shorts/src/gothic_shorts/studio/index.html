<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Озвучка</title>
<style>
  :root {
    --bg: #14110d; --panel: #1e1a14; --line: #2e281f; --text: #f3ede2; --dim: #8a8072; --faint: #4d463b;
    --gold: #ffd678; --red: #ff5a5a; --blue: #7ec8ff; --green: #8be08b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; overflow: hidden; }
  button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.on { border-color: var(--gold); color: var(--gold); }
  button.armed { border-color: var(--red); color: var(--red); background: #3a1b17;
    box-shadow: 0 0 0 1px var(--red); }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--faint); border-radius: 4px; padding: 0 5px;
    color: var(--dim); }

  header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  header .name { font-weight: 700; letter-spacing: .02em; }
  header .grow { flex: 1; }
  .meter { width: 220px; height: 10px; background: var(--panel); border-radius: 5px; position: relative; overflow: hidden;
    border: 1px solid var(--line); }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); width: 0; }
  .meter b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); left: 0; }
  .meter.clip i { background: var(--red); }
  .db { width: 64px; color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; }

  main { display: grid; grid-template-columns: auto 1fr; gap: 24px; padding: 18px 24px; min-height: 0; }
  .screen { height: 100%; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .screen video { height: calc(100% - 26px); aspect-ratio: 9 / 16; background: #000; border-radius: 10px;
    border: 1px solid var(--line); object-fit: contain; }
  .screen .novideo { height: 100%; aspect-ratio: 9 / 16; display: grid; place-items: center; color: var(--dim);
    border: 1px dashed var(--faint); border-radius: 10px; text-align: center; padding: 20px; }
  .vbar { height: 8px; background: var(--panel); border-radius: 4px; position: relative; }
  .vbar .span { position: absolute; top: 0; bottom: 0; background: var(--faint); border-radius: 4px; }
  .vbar .head { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--gold); }

  .prompt { display: flex; flex-direction: column; min-height: 0; }
  .count { color: var(--dim); margin-bottom: 18px; }
  .prev, .next { color: var(--faint); font-size: 24px; line-height: 1.35; min-height: 1.35em; }
  .cur { font-size: 46px; line-height: 1.3; font-weight: 650; margin: 22px 0; max-width: 1100px;
    transition: color .15s; }
  .cur.wait { color: var(--dim); }
  .cur.go { color: var(--text); }
  .cue { display: flex; align-items: center; gap: 16px; min-height: 44px; margin-top: 10px; }
  .cue .state { font-weight: 700; font-size: 18px; }
  .cue .state.rec { color: var(--red); }
  .cue .state.ready { color: var(--gold); }
  .fit { flex: 1; max-width: 520px; height: 10px; background: var(--panel); border-radius: 5px; position: relative;
    border: 1px solid var(--line); }
  .fit i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); width: 0; border-radius: 5px; }
  .fit.over i { background: var(--red); }
  .hint { color: var(--dim); }

  .takes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; align-items: center; }
  .take { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer;
    font-variant-numeric: tabular-nums; }
  .take.chosen { border-color: var(--gold); }
  .take .k { font-weight: 700; margin-right: 6px; }
  .take .warn { color: var(--red); margin-left: 6px; }
  .take.chosen .k::after { content: " ✓"; color: var(--gold); }
  .actions { display: flex; gap: 8px; margin-left: 10px; }
  .msg { margin-top: 18px; min-height: 1.4em; color: var(--dim); }
  .msg.err { color: var(--red); }
  .done { margin-top: 18px; color: var(--green); font-weight: 600; }

  footer { border-top: 1px solid var(--line); padding: 10px 18px; display: flex; flex-direction: column; gap: 8px; }
  .lines { display: flex; gap: 6px; flex-wrap: wrap; }
  .lines button { min-width: 40px; padding: 4px 8px; }
  .lines button.here { border-color: var(--text); color: var(--text); }
  .lines button.has { color: var(--dim); }
  .lines button.ok { color: var(--gold); }
  .keys { color: var(--dim); display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; }
</style>
</head>
<body>
<header>
  <span class="name" id="name">Озвучка</span>
  <span class="grow"></span>
  <select id="mic" title="микрофон"></select>
  <div class="meter" id="meter"><i></i><b></b></div>
  <span class="db" id="db">— dB</span>
  <button id="room" title="10 секунд тишины комнаты: шумоподавлению нужен образец">Тишина 10 с</button>
  <button id="sound" title="звук игры под картинкой: только в наушниках, иначе он попадёт в запись">Звук видео: выкл</button>
  <button id="run" title="прогнать весь ролик с суфлёром, без записи">Прогон</button>
</header>
<main>
  <div class="screen" id="screen">
    <video id="video" playsinline preload="auto" muted></video>
    <div class="vbar" id="vbar"><div class="span" id="vspan"></div><div class="head" id="vhead"></div></div>
  </div>
  <section class="prompt">
    <div class="count" id="count"></div>
    <div class="prev" id="prev"></div>
    <div class="cur" id="cur"></div>
    <div class="next" id="next"></div>
    <div class="cue">
      <span class="state" id="state"></span>
      <div class="fit" id="fit"><i></i></div>
      <span class="hint" id="planlen"></span>
    </div>
    <div class="takes" id="takes"></div>
    <div class="msg" id="msg"></div>
    <div class="done" id="done"></div>
  </section>
</main>
<footer>
  <div class="lines" id="lines"></div>
  <div class="keys">
    <span><kbd>Пробел</kbd> запись / стоп</span>
    <span><kbd>Esc</kbd> отменить дубль</span>
    <span><kbd>Enter</kbd> прослушать с картинкой</span>
    <span><kbd>↑</kbd> <kbd>↓</kbd> фраза</span>
    <span><kbd>1</kbd>–<kbd>9</kbd> выбрать дубль</span>
    <span><kbd>⌫</kbd> дважды за 3 с — в корзину</span>
    <span><kbd>Z</kbd> вернуть дубль</span>
  </div>
</footer>
<script src="/app/app.js"></script>
</body>
</html>
