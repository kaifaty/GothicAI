[build-system]
requires = ["scikit-build-core>=0.11,<1", "nanobind>=2.9,<3"]
build-backend = "scikit_build_core.build"

[project]
name = "society-sim"
version = "0.1.0"
description = "Batched bindings for the GothicAI society simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[tool.scikit-build]
wheel.packages = ["src/society_sim"]
