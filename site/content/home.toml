# The home page and the site's settings. Posts are in content/posts/.

[site]
title = "Gothic AI"
base = "/GothicAI/"                          # the path on GitHub Pages (a project site)
url = "https://kaifaty.github.io/GothicAI"
repo = "https://github.com/kaifaty/GothicAI"
telegram = ""                                # the channel's link, once there is one

[hero]
youtube = ""                                 # the short's video id once it is on YouTube: replaces the loop
poster = "hero/wrath.jpg"                    # in static/
loop_en = "hero/wrath-en.mp4"
loop_ru = "hero/wrath-ru.mp4"

[en]
description = "Gothic II with NPCs that hear the player's voice, answer in their own voices, act and remember. An open-source experiment on the OpenGothic engine."
feed_title = "Gothic AI devlog"
dialogue_label = "A conversation from the game"
dialogue = [
  { hero = true, name = "Hero", text = "Xardas, aren't you a bit old for all this magic?" },
  { name = "Xardas", text = "Magic takes knowledge, not young bones. Think about your own strength: after the Sleeper's temple you have a lot to win back." },
  { hero = true, name = "Hero", text = "Listen, you half-baked necromancer, can you do anything besides talk?" },
  { name = "Xardas", text = "I pulled you out from under the temple's ruins when your own strength could no longer help you. Don't mistake my patience for weakness." },
  { hero = true, name = "Hero", text = "You know, I bet your mother was all talk too." },
  { name = "Xardas", text = "You do not speak of my mother. This conversation is over. You will serve me in silence." },
]
dialogue_note = "Nobody wrote Xardas' lines, and nobody decided when he would snap: his language model did. The hero speaks with a synthetic voice, Xardas hears it through speech recognition. The answers are unedited; only the pauses while the model thinks are cut. Then the game raises the hero as a skeleton."
video_alt = "The hero insults Xardas; Xardas kills him and raises him as a skeleton"
headline = "Gothic II, where the people hear you, answer and remember"
lede = "The original game on the OpenGothic engine, with a language model behind its characters. You hold a key and speak; the one you face hears you, answers in a voice of its own, acts on what you said and remembers it in your save."
read_devlog = "Read the devlog"
see_code = "See the code"
features_title = "What works now"
features = [
  { title = "Talk with your voice", text = "Hold T and speak, no chat window. The server works out whom you are talking to." },
  { title = "Voices of their own", text = "The 36 plot characters speak in the voices of the Russian dub, cloned from their lines in your own copy of the game; everyone else gets a voice designed from their character. Speech starts while the answer is still being written." },
  { title = "Deeds, not only words", text = "Characters follow you, hand over items, draw weapons, fight or run away." },
  { title = "Memory", text = "They remember your conversations within a save, and bystanders hear what you tell someone else: a lie in front of witnesses is known." },
  { title = "Two minds", text = "A small fast model settles reactions, the daily routine and who joins a conversation in a fraction of a second; the large model talks and decides what to do." },
  { title = "Feet on the ground", text = "People and beasts stand on slopes and stairs with every foot instead of hovering over them." },
]
how_title = "How a conversation goes"
how_text = "The game stays the original: a thin bridge inside the engine talks to an AI server running beside it."
how_steps = [
  "You hold the talk key and speak.",
  "Speech recognition turns your voice into text while you speak.",
  "The server picks whom you addressed and gives that character its persona, its memory of you and what it sees.",
  "The language model answers and may act: give, follow, draw a weapon.",
  "Text-to-speech voices the answer, and the character speaks it in the game.",
]
devlog_title = "Devlog"
status = "Not playable yet: it runs from source on macOS, and the Windows build has not been tried on a real PC. It needs your own copy of the Russian Gothic II Gold (with Night of the Raven)."

[ru]
description = "Gothic II, где NPC слышат голос игрока, отвечают своими голосами, действуют и помнят. Открытый эксперимент на движке OpenGothic."
feed_title = "Дневник Gothic AI"
dialogue_label = "Разговор из игры"
dialogue = [
  { hero = true, name = "Герой", text = "Ксардас, а ты не староват для всей этой магии?" },
  { name = "Ксардас", text = "Магия требует знаний, а не молодых костей. Лучше подумай о собственной силе: после храма Спящего тебе ещё многое предстоит вернуть." },
  { hero = true, name = "Герой", text = "Слушай, некромант недоделанный, ты хоть что-нибудь умеешь, кроме болтовни?" },
  { name = "Ксардас", text = "Я вытащил тебя из-под руин храма, когда твоя собственная сила уже не могла тебе помочь. Не путай моё терпение с бессилием." },
  { hero = true, name = "Герой", text = "Знаешь, твоя мамаша, небось, тоже только болтать умела." },
  { name = "Ксардас", text = "О моей матери ты говорить не смеешь. Этот разговор окончен. Ты послужишь мне молча." },
]
dialogue_note = "Реплики Ксардаса никто не писал, и когда он сорвётся, тоже никто не решал: это решила его языковая модель. Герой говорит синтезированным голосом, Ксардас слышит его через распознавание речи. Ответы не правились, вырезаны только паузы, пока модель думает. Дальше игра поднимает героя скелетом."
video_alt = "Герой хамит Ксардасу, Ксардас убивает его и поднимает скелетом"
headline = "Gothic II, где жители слышат тебя, отвечают и помнят"
lede = "Оригинальная игра на движке OpenGothic, а за персонажами — языковая модель. Зажимаешь клавишу и говоришь: тот, к кому ты обращаешься, слышит, отвечает своим голосом, делает то, о чём договорились, и помнит это в твоём сохранении."
read_devlog = "Читать дневник"
see_code = "Код проекта"
features_title = "Что уже работает"
features = [
  { title = "Разговор голосом", text = "Зажимаешь T и говоришь, без окна чата. Сервер сам понимает, к кому ты обращаешься." },
  { title = "Свои голоса", text = "36 сюжетных персонажей говорят голосом своей русской озвучки: он клонируется по их репликам из вашей копии игры. Остальным голос создаётся по описанию характера. Речь начинает звучать, пока ответ ещё пишется." },
  { title = "Дела, а не только слова", text = "Персонажи идут за тобой, отдают вещи, достают оружие, дерутся или убегают." },
  { title = "Память", text = "Разговоры запоминаются в рамках сохранения, а свидетели слышат, что ты сказал другому: соврал при всех — об этом знают." },
  { title = "Два ума", text = "Небольшая быстрая модель за доли секунды решает реакции, распорядок и кто вмешается в разговор; большая модель разговаривает и решает, что делать." },
  { title = "Ноги на земле", text = "Люди и звери стоят на склонах и ступенях всеми ногами, а не висят над ними." },
]
how_title = "Как идёт разговор"
how_text = "Игра остаётся оригинальной: тонкий мост внутри движка общается с ИИ-сервером, который работает рядом."
how_steps = [
  "Ты зажимаешь клавишу разговора и говоришь.",
  "Распознавание речи превращает голос в текст прямо во время фразы.",
  "Сервер выбирает, к кому ты обратился, и даёт этому персонажу его характер, память о тебе и то, что он видит.",
  "Языковая модель отвечает и может действовать: отдать, пойти следом, достать оружие.",
  "Синтез речи озвучивает ответ, и персонаж произносит его в игре.",
]
devlog_title = "Дневник"
status = "Поиграть пока нельзя: проект запускается из исходников на macOS, а сборку для Windows ещё не проверяли на настоящем компьютере. Нужна своя копия русской Gothic II Gold (с «Ночью Ворона»)."
