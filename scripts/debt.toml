exclude = ["OpenGothic/lib", "reports", "research_notes"]

[ratchet]
# Warn before this UTC date; fail on growth from this date onward.
enforce_from = 2026-11-19

[hotspot]
priority = 1
extensions = [".py", ".cpp", ".h", ".hpp", ".c", ".cc", ".cxx"]
window_days = 30
open_lines = 2500
close_lines = 2000
open_score = 300000
close_score = 150000
heavy_score = 1200000

[doc-now]
priority = 1
open_score = 61440
close_score = 20480
heavy_score = 122880

[doc-file]
priority = 1
paths = ["docs/README.md", "docs/features.md"]
open_score = 153600
close_score = 61440
heavy_score = 307200

[ruff]
priority = 2
version = "0.17.0"
open_score = 10
close_score = 1
heavy_score = 100

[orphan-scripts]
priority = 3
open_score = 1
close_score = 1

[sync]
max_new = 5
reopen_factor = 1.5

[codex]
kinds = ["duplicate-logic", "workaround", "stale-flag", "dead-code", "layer-breach", "untested-logic", "fragile-test", "doc-drift"]
exclude = ["OpenGothic/shader", "OpenGothic/common/graphics", "OpenGothic/common/ui", "scripts/content", "scripts/meshes", "scripts/hd", "site", "launcher/app"]
max_new = 3
