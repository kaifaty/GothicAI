[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "character-tool"
version = "0.1.0"
description = "Offline tools for Gothic characters and facial animation"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
authoring = ["numpy", "Pillow"]

[project.scripts]
character-tool = "character_tool.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.sh", "*.cpp", "*.h", "*.txt", "*.cmake", "*.md"]
