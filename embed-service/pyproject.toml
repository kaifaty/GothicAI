[project]
name = "gothic-embed"
version = "0.1.0"
description = "HTTP embeddings for NPC memory retrieval"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "numpy>=2.4.2",
]

[project.optional-dependencies]
gpu = [
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
]

[project.scripts]
gothic-embed = "gothic_embed.cli:main"

[tool.uv.build-backend]
module-name = "gothic_embed"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
