# The project site (site/, Nuxt generating static pages on bun): built on every pull request that touches it,
# published to GitHub Pages from main.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # only the author's repository has the site: forks never build or deploy it
    if: github.repository == 'kaifaty/GothicAI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Test
        working-directory: site
        run: bun run test
      - name: Build
        working-directory: site
        env:
          NUXT_APP_BASE_URL: /GothicAI/
        run: bun run generate
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/.output/public

  deploy:
    if: github.repository == 'kaifaty/GothicAI' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
