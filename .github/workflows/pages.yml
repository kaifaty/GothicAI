# The project site (site/): built on every pull request that touches it, published to GitHub Pages from main.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # only the author's repository has the site: forks never build or deploy it
    if: github.repository == 'kaifaty/GothicAI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv publishes no floating major tags
      - name: Test
        run: uv run --project site pytest -q site/tests
      - name: Build
        run: uv run --project site gothic-site build --out site/_build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_build

  deploy:
    if: github.repository == 'kaifaty/GothicAI' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
