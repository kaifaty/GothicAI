name: Python tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.select.outputs.groups }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Select tests
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(ci-matrix --event "$EVENT_NAME")
          if [[ "$EVENT_NAME" == pull_request ]]; then
            args+=(--base "$BASE_SHA")
          fi
          groups=$(python3 scripts/check.py "${args[@]}")
          printf 'groups=%s\n' "$groups" >> "$GITHUB_OUTPUT"

  test:
    needs: select
    if: ${{ needs.select.outputs.groups != '[]' }}
    runs-on: ${{ matrix.platform }}
    name: test (${{ matrix.name }})
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.groups) }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.4"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          cache-suffix: ${{ matrix.name }}
      - name: Install FFmpeg for synthetic media tests
        if: ${{ runner.os == 'macOS' }}
        run: brew install ffmpeg
      - name: Run selected tests
        working-directory: ${{ matrix.dir }}
        env:
          TEST_COMMAND: ${{ matrix.command }}
        run: bash -euo pipefail -c "$TEST_COMMAND"

  tests:
    if: ${{ always() }}
    needs: [select, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected group to pass
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SELECTED_GROUPS: ${{ needs.select.outputs.groups }}
        run: |
          if [[ "$SELECT_RESULT" != success ]]; then
            echo "Test selection failed: $SELECT_RESULT"
            exit 1
          fi
          if [[ "$TEST_RESULT" == success ]]; then
            exit 0
          fi
          if [[ "$TEST_RESULT" == skipped && "$SELECTED_GROUPS" == '[]' ]]; then
            echo "No Python tests selected."
            exit 0
          fi
          echo "Selected tests did not pass: $TEST_RESULT"
          exit 1
