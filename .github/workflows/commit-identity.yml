name: Commit identity

on: pull_request

permissions:
  contents: read

concurrency:
  group: commit-identity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Check commit addresses
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Use the base's checker so a PR cannot loosen its own check; before it lands, use the PR's.
          tool=$(mktemp -d)
          git show "$BASE_SHA:scripts/commit_identity.py" > "$tool/commit_identity.py" 2> /dev/null \
            || cp scripts/commit_identity.py "$tool/commit_identity.py"
          python3 "$tool/commit_identity.py" check --base "$BASE_SHA" --head "$HEAD_SHA"
