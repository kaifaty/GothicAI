# The prebuilt archives for players, Windows x64 and Linux x64: this fork's game with its AI bridge, the
# base and video converter and the story graph converter, the AI services' sources and locks, the pinned
# uv and the entry points. Run by hand only, before a release (the user's decision of 2026-10-31: pull
# requests do not build these). One job per platform on standard GitHub-hosted runners, no caches. The
# `windows` and `linux` inputs choose the platforms. With `release: none` (the default) the run only
# validates: build, converter and launcher checks and the package checks, and the archives stay on the
# runners. With `draft` or `prerelease` each platform job hands its archive, manifest and SHA256SUMS to
# the `release` job as a one-day workflow artifact, and that job, the only one that may write, makes one
# GitHub release with every built archive and one SHA256SUMS over all of them, after everything passed.
# `draft` is a draft prerelease the maintainer publishes after checking the assets; `prerelease` is
# published at once. Documented in docs/development.md (Windows, Linux) and docs/threat-model.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      windows:
        description: Build the Windows x64 archive
        type: boolean
        default: true
      linux:
        description: Build the Linux x64 archive
        type: boolean
        default: true
      release:
        description: "none: only build and check; draft: a draft prerelease; prerelease: a published prerelease"
        type: choice
        options: [none, draft, prerelease]
        default: none

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUILD_TYPE: Release
  VULKAN_SDK_VERSION: 1.4.357.0  # the version upstream OpenGothic's CI builds with
  # the Linux SDK tarball of that version, as LunarG publishes it (sdk/sha/.../linux/...tar.xz.txt)
  VULKAN_SDK_LINUX_SHA256: 0f09bf6a0625e346bf004be70b92907e934a4c76606b323441b2baf3a5a0e66d
  # Linux: g++-13 from the ubuntu-toolchain-r/test PPA (GCC 12 of 22.04 raises a false -Werror=restrict in
  # std::string, fixed in libstdc++ 13); libstdc++ and libgcc linked statically, so the glibc floor stays 2.35
  GCC_VERSION: "13"
  UV_VERSION: 0.10.4  # matches the projects' uv_build>=0.10.4,<0.11 backend
  UV_PYTHON: "3.12"  # what players get: the services pin 3.12
  PYTHONUTF8: "1"

jobs:
  windows:
    if: ${{ inputs.windows }}
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: PowerShell scripts parse in Windows PowerShell 5.1 and stay ASCII
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($_.FullName):$($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
            if ([System.IO.File]::ReadAllBytes($_.FullName) | Where-Object { $_ -gt 127 } | Select-Object -First 1) {
              Write-Host "$($_.FullName): not ASCII (5.1 reads a .ps1 without BOM in the ANSI code page)"; $failed = $true
            }
          }
          Get-Content -Raw -Encoding UTF8 scripts/windows/messages.ru.json | ConvertFrom-Json | Out-Null
          if ($failed) { exit 1 }

      - name: uv, the pinned official release (also packed for players)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'uv'
          New-Item -ItemType Directory -Force -Path "$dir/bin", "$dir/licenses" | Out-Null
          $base = "https://github.com/astral-sh/uv/releases/download/$env:UV_VERSION"
          $zip = Join-Path $dir 'uv-x86_64-pc-windows-msvc.zip'
          Invoke-WebRequest "$base/uv-x86_64-pc-windows-msvc.zip" -OutFile $zip
          Invoke-WebRequest "$base/uv-x86_64-pc-windows-msvc.zip.sha256" -OutFile "$zip.sha256"
          $expected = ((Get-Content -Raw "$zip.sha256").Trim() -split '\s+')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "uv archive checksum: $actual, published $expected" }
          Expand-Archive $zip -DestinationPath "$dir/bin" -Force
          foreach ($name in 'LICENSE-MIT', 'LICENSE-APACHE') {
            Invoke-WebRequest "https://raw.githubusercontent.com/astral-sh/uv/$env:UV_VERSION/$name" -OutFile "$dir/licenses/$name"
          }
          $uv = Get-ChildItem "$dir/bin" -Recurse -Filter uv.exe | Select-Object -First 1
          Add-Content $env:GITHUB_PATH $uv.DirectoryName
          Add-Content $env:GITHUB_ENV "UV_ZIP=$zip"
          Add-Content $env:GITHUB_ENV "UV_LICENSES=$dir/licenses"

      # Each suite from its own project folder: `uv run --project` keeps the working directory, and pytest
      # would collect from the repository root. Includes the real job object and lock tests.
      - name: Launcher core tests on Windows (no keys, no network models)
        working-directory: launcher/core
        run: |
          uv run --locked pytest -q -rs tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: ChatGPT auth tests on Windows (no keys, no network models)
        working-directory: libs/chatgpt-auth
        run: |
          uv run --locked pytest -q -rs tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Base-game profile tests on Windows (synthetic archives, no game files)
        run: |
          uv run --locked --project launcher/core pytest -q -rs scripts/tests/test_windows_game_profile.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: The services and the chosen providers import on Windows
        run: |
          $checks = @(
            @('server', 'import gothic_ai.cli, gothic_ai.gamedata.ou, gothic_ai.llm.siwc, gothic_ai.llm.openai_responses, gothic_ai.voice, gothic_ai.gates, gothic_ai.dialogue'),
            @('asr-service', 'import gothic_asr.cli, gothic_asr.providers.chatgpt'),
            @('tts-service', 'import gothic_tts.cli, gothic_tts.providers.inworld, gothic_tts.originals')
          )
          foreach ($check in $checks) {
            uv run --locked --project $check[0] python -c $check[1]
            if ($LASTEXITCODE) { throw "$($check[0]): imports failed" }
          }
          foreach ($tool in @(@('server', 'gothic-ai'), @('asr-service', 'gothic-asr'), @('tts-service', 'gothic-tts'))) {
            uv run --locked --project $tool[0] $tool[1] --help | Out-Null
            if ($LASTEXITCODE) { throw "$($tool[1]) --help failed" }
          }

      - name: Vulkan SDK (headers, loader library and glslangValidator for the build only)
        run: |
          $root = Join-Path $env:RUNNER_TEMP "VulkanSDK/$env:VULKAN_SDK_VERSION"
          $installer = Join-Path $env:RUNNER_TEMP 'vulkansdk.exe'
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          Invoke-WebRequest $url -OutFile $installer
          Write-Host "Vulkan SDK installer SHA-256: $((Get-FileHash $installer -Algorithm SHA256).Hash)"
          & $installer --accept-licenses --default-answer --confirm-command install --root $root | Out-Null
          if (-not (Test-Path (Join-Path $root 'Bin/glslangValidator.exe'))) { throw "no Vulkan SDK in $root" }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$root"

      - name: Build this fork's game (AI bridge), content-convert and storygraph with MSVC
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-engine.ps1 -BuildType $env:BUILD_TYPE
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: The converter passes its self-test and refuses a folder without Gothic II
        env:
          OPENGOTHIC_BASE_CACHE: ${{ runner.temp }}\base-cache  # a throwaway cache, nothing in AppData
        run: |
          $convert = Join-Path $env:GITHUB_WORKSPACE 'OpenGothic\build\opengothic\content-convert.exe'
          & $convert --self-test
          if ($LASTEXITCODE) { throw "content-convert --self-test failed with exit code $LASTEXITCODE" }
          $empty = Join-Path $env:RUNNER_TEMP 'no-game'
          New-Item -ItemType Directory -Force -Path $empty | Out-Null
          $out = & $convert resolve $empty 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) { throw 'content-convert resolve accepted a folder without Gothic II' }
          if ($out -notmatch 'no ready base for') { throw "content-convert resolve: unexpected failure (exit code $code)" }
          # the expected failure passed: the runner would otherwise end the step with it
          exit 0

      - name: The launcher finds the built game and converters
        env:
          USERPROFILE: ${{ runner.temp }}\profile  # a throwaway profile: no settings, keys or sign-in
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          uv run --locked --project launcher/core gothic-launcher --help | Out-Null
          if ($LASTEXITCODE) { throw 'gothic-launcher --help failed' }
          $out = uv run --locked --project launcher/core gothic-launcher setup --check 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 2) { throw "setup --check: expected 2 (no game folder or sign-in here), got $code" }
          if ($out -match 'не собран|не найден uv') { throw 'the launcher does not see the built game, content-convert or storygraph' }
          $empty = Join-Path $env:RUNNER_TEMP 'no-game'
          New-Item -ItemType Directory -Force -Path $empty | Out-Null
          $json = uv run --locked --project launcher/core gothic-launcher check $empty
          $code = $LASTEXITCODE
          Write-Host $json
          if ($code -ne 1) { throw "check: expected 1 for a folder without Gothic II, got $code" }
          $items = @($json | ConvertFrom-Json)
          if ($items.Count -ne 1 -or $items[0].id -ne 'folder' -or $items[0].ok) { throw 'check: unexpected answer' }
          # the expected codes passed: the runner would otherwise end the step with them
          exit 0

      - name: Package
        run: |
          $name = "GothicAI-windows-x64-r${{ github.run_number }}-$('${{ github.sha }}'.Substring(0, 7))"
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows/package.ps1 `
            -UvZip $env:UV_ZIP -UvLicenses $env:UV_LICENSES -OutDir $dist -Name $name `
            -Repository '${{ github.server_url }}/${{ github.repository }}' -Commit '${{ github.sha }}' -RunUrl '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' `
            -VulkanSdkVersion $env:VULKAN_SDK_VERSION -UvVersion $env:UV_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_ENV "PACKAGE_NAME=$name"
          Add-Content $env:GITHUB_ENV "PACKAGE_DIR=$dist"

      - name: Hand the archive to the release job
        if: ${{ inputs.release != 'none' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            ${{ env.PACKAGE_DIR }}/${{ env.PACKAGE_NAME }}.zip
            ${{ env.PACKAGE_DIR }}/${{ env.PACKAGE_NAME }}.manifest.json
            ${{ env.PACKAGE_DIR }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  linux:
    if: ${{ inputs.linux }}
    # glibc 2.35: the archive runs on Ubuntu 22.04+, Debian 12+, Fedora 36+, SteamOS 3
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Shell scripts parse and pass shellcheck
        run: |
          scripts=(Setup-GothicAI.sh Start-GothicAI.sh scripts/linux/*.sh)
          for f in "${scripts[@]}"; do bash -n "$f"; done
          if ! command -v shellcheck > /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          fi
          shellcheck -x "${scripts[@]}"

      - name: Build packages (compiler, Ninja, the X11 and sound headers the engine and OpenAL Soft use)
        run: |
          sudo apt-get update
          # Exact names only: apt-cache show and apt-get install read a name that matches no package as a
          # regular expression, and "g++-13" ("g", one or more "+", "-13") then matches clang-13. The whole
          # list is read (no grep -q) so that pipefail does not turn apt-cache's SIGPIPE into "absent".
          has_package() { apt-cache pkgnames | grep -xF "$1" > /dev/null; }
          if ! has_package "g++-$GCC_VERSION"; then
            # a newer GCC than Ubuntu 22.04 has: the toolchain PPA; static libstdc++ keeps the glibc floor
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            has_package "g++-$GCC_VERSION" || { echo "no package g++-$GCC_VERSION even with the toolchain PPA"; exit 1; }
          fi
          sudo apt-get install -y --no-install-recommends "gcc-$GCC_VERSION" "g++-$GCC_VERSION" ninja-build pkg-config \
            libx11-dev libxcursor-dev libasound2-dev libpulse-dev libpipewire-0.3-dev
          for tool in "gcc-$GCC_VERSION" "g++-$GCC_VERSION"; do
            command -v "$tool" > /dev/null || { echo "$tool is not installed after apt-get install"; exit 1; }
          done
          {
            echo "CC=gcc-$GCC_VERSION"
            echo "CXX=g++-$GCC_VERSION"
          } >> "$GITHUB_ENV"
          cmake --version | head -1
          "g++-$GCC_VERSION" --version | head -1

      - name: uv, the pinned official release (also packed for players)
        run: |
          dir="$RUNNER_TEMP/uv"
          mkdir -p "$dir/bin" "$dir/licenses"
          base="https://github.com/astral-sh/uv/releases/download/$UV_VERSION"
          tarball="$dir/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" "$base/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$tarball.sha256" "$base/uv-x86_64-unknown-linux-gnu.tar.gz.sha256"
          expected=$(awk '{print $1; exit}' "$tarball.sha256")
          actual=$(sha256sum "$tarball" | awk '{print $1}')
          if [[ "$actual" != "$expected" ]]; then echo "uv archive checksum: $actual, published $expected"; exit 1; fi
          tar -xzf "$tarball" -C "$dir/bin" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          for name in LICENSE-MIT LICENSE-APACHE; do
            curl -fsSL --retry 3 -o "$dir/licenses/$name" "https://raw.githubusercontent.com/astral-sh/uv/$UV_VERSION/$name"
          done
          "$dir/bin/uv" --version
          echo "$dir/bin" >> "$GITHUB_PATH"
          {
            echo "UV_TAR=$tarball"
            echo "UV_LICENSES=$dir/licenses"
            # fixed places, so that the checks below with a throwaway HOME reuse the synced environments
            echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache"
            echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/uv-python"
          } >> "$GITHUB_ENV"

      - name: The services and the chosen providers import on Linux
        run: |
          uv run --locked --project server python -c 'import gothic_ai.cli, gothic_ai.gamedata.ou, gothic_ai.llm.siwc, gothic_ai.llm.openai_responses, gothic_ai.voice, gothic_ai.gates, gothic_ai.dialogue'
          uv run --locked --project asr-service python -c 'import gothic_asr.cli, gothic_asr.providers.chatgpt'
          uv run --locked --project tts-service python -c 'import gothic_tts.cli, gothic_tts.providers.inworld, gothic_tts.originals'
          uv run --locked --project server gothic-ai --help > /dev/null
          uv run --locked --project asr-service gothic-asr --help > /dev/null
          uv run --locked --project tts-service gothic-tts --help > /dev/null

      - name: Vulkan SDK (headers, loader library and glslangValidator for the build only)
        run: |
          tarball="$RUNNER_TEMP/vulkansdk.tar.xz"
          name="vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz"
          curl -fsSL --retry 3 -o "$tarball" "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/$name"
          published=$(curl -fsSL --retry 3 "https://sdk.lunarg.com/sdk/sha/$VULKAN_SDK_VERSION/linux/$name.txt" | awk '{print $1; exit}')
          actual=$(sha256sum "$tarball" | awk '{print $1}')
          echo "Vulkan SDK SHA-256: $actual (pinned $VULKAN_SDK_LINUX_SHA256, published $published)"
          if [[ "$actual" != "$VULKAN_SDK_LINUX_SHA256" ]] || [[ "$published" != "$VULKAN_SDK_LINUX_SHA256" ]]; then
            echo 'the Vulkan SDK tarball does not match its pinned and published SHA-256'; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/VulkanSDK"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/VulkanSDK"
          rm -f "$tarball"
          # Layout of the Linux SDK 1.4.357.0 (checked by listing the tarball): headers in include/vulkan/,
          # the loader in lib/VulkanLoader/lib/ (libvulkan.so -> .so.1 -> .so.1.4.357), not lib/;
          # bin/glslangValidator is a link to bin/glslang of the same SDK. Tempest links -lvulkan with
          # $VULKAN_SDK/lib as its only extra folder, so the linker finds the loader through LIBRARY_PATH,
          # as upstream's setup-vulkan action does.
          root="$RUNNER_TEMP/VulkanSDK/$VULKAN_SDK_VERSION/x86_64"
          loader="$root/lib/VulkanLoader/lib"
          test -f "$root/include/vulkan/vulkan.h"
          test -e "$loader/libvulkan.so"
          ls -l "$loader"/libvulkan.so*
          "$root/bin/glslangValidator" --version
          {
            echo "VULKAN_SDK=$root"
            echo "LIBRARY_PATH=$loader${LIBRARY_PATH:+:$LIBRARY_PATH}"
          } >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Build this fork's game (AI bridge), content-convert and storygraph with GCC
        run: scripts/linux/build.sh

      - name: The converter passes its self-test and refuses a folder without Gothic II
        env:
          HOME: ${{ runner.temp }}/home  # a throwaway home: nothing in the runner's own
          XDG_CONFIG_HOME: ${{ runner.temp }}/home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/home/.local/share
          XDG_STATE_HOME: ${{ runner.temp }}/home/.local/state
          XDG_CACHE_HOME: ${{ runner.temp }}/home/.cache
          OPENGOTHIC_BASE_CACHE: ${{ runner.temp }}/base-cache
        run: |
          mkdir -p "$HOME"
          convert="$GITHUB_WORKSPACE/OpenGothic/build/opengothic/content-convert"
          "$convert" --self-test
          empty="$RUNNER_TEMP/no-game"
          mkdir -p "$empty"
          code=0
          out=$("$convert" resolve "$empty" 2>&1) || code=$?
          echo "$out"
          if ((code == 0)); then echo 'content-convert resolve accepted a folder without Gothic II'; exit 1; fi
          if ! grep -q 'no ready base for' <<< "$out"; then echo "content-convert resolve: unexpected failure (exit code $code)"; exit 1; fi

      - name: The launcher finds the built game and converters
        env:
          HOME: ${{ runner.temp }}/home  # a throwaway home: no settings, keys or sign-in
          XDG_CONFIG_HOME: ${{ runner.temp }}/home/.config
          XDG_DATA_HOME: ${{ runner.temp }}/home/.local/share
          XDG_STATE_HOME: ${{ runner.temp }}/home/.local/state
          XDG_CACHE_HOME: ${{ runner.temp }}/home/.cache
          OPENGOTHIC_BASE_CACHE: ${{ runner.temp }}/base-cache
        run: |
          mkdir -p "$HOME"
          uv run --locked --project launcher/core gothic-launcher --help > /dev/null
          code=0
          out=$(uv run --locked --project launcher/core gothic-launcher setup --check 2>&1) || code=$?
          echo "$out"
          if ((code != 2)); then echo "setup --check: expected 2 (no game folder or sign-in here), got $code"; exit 1; fi
          if grep -Eq 'не собран|не найден uv' <<< "$out"; then
            echo 'the launcher does not see the built game, content-convert or storygraph'; exit 1
          fi
          empty="$RUNNER_TEMP/no-game"
          mkdir -p "$empty"
          code=0
          json=$(uv run --locked --project launcher/core gothic-launcher check "$empty") || code=$?
          echo "$json"
          if ((code != 1)); then echo "check: expected 1 for a folder without Gothic II, got $code"; exit 1; fi
          python3 -c '
          import json, sys
          items = json.loads(sys.argv[1])
          assert len(items) == 1 and items[0]["id"] == "folder" and items[0]["ok"] is False, "check: unexpected answer"
          ' "$json"

      - name: Package
        run: |
          name="GothicAI-linux-x64-r$GITHUB_RUN_NUMBER-${GITHUB_SHA::7}"
          dist="$RUNNER_TEMP/dist"
          scripts/linux/package.sh --uv-tar "$UV_TAR" --uv-licenses "$UV_LICENSES" --out-dir "$dist" --name "$name" \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --vulkan-sdk-version "$VULKAN_SDK_VERSION" --uv-version "$UV_VERSION" \
            --compiler "$("$CXX" --version | head -1)"
          {
            echo "PACKAGE_NAME=$name"
            echo "PACKAGE_DIR=$dist"
          } >> "$GITHUB_ENV"

      - name: Hand the archive to the release job
        if: ${{ inputs.release != 'none' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            ${{ env.PACKAGE_DIR }}/${{ env.PACKAGE_NAME }}.tar.gz
            ${{ env.PACKAGE_DIR }}/${{ env.PACKAGE_NAME }}.manifest.json
            ${{ env.PACKAGE_DIR }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # One release with every archive that was built: a platform that was not chosen is skipped and does
  # not hold it, a failed or cancelled one does.
  release:
    needs: [windows, linux]
    if: >-
      ${{ !cancelled() && inputs.release != 'none'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write  # only this job: the release and its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts

      - name: One release with the archives, their manifests and one SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          WINDOWS: ${{ needs.windows.result }}
          LINUX: ${{ needs.linux.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          assets=()
          platforms=()
          notes="$out/notes.md"
          {
            echo "Prebuilt archives of $GITHUB_SHA, built by $RUN_URL."
            echo
          } > "$notes"
          for platform in windows linux; do
            result=WINDOWS
            [[ $platform == linux ]] && result=LINUX
            [[ ${!result} == success ]] || continue
            dir="$RUNNER_TEMP/artifacts/$platform"
            # what the platform job packed, intact (package.ps1 writes Windows line ends)
            (cd "$dir" && tr -d '\r' < SHA256SUMS | sha256sum --check --strict -)
            for file in "$dir"/*; do
              [[ $(basename "$file") == SHA256SUMS ]] && continue
              cp "$file" "$out/"
              assets+=("$out/$(basename "$file")")
            done
            if [[ $platform == windows ]]; then
              platforms+=('Windows x64')
              echo "**Windows x64** (\`GothicAI-windows-x64-….zip\`): compiled with MSVC on windows-2022 and unit-tested there. Gameplay, graphics and the microphone have not been tested on a real PC yet." >> "$notes"
            else
              platforms+=('Linux x64')
              echo "**Linux x64** (\`GothicAI-linux-x64-….tar.gz\`): compiled with GCC $GCC_VERSION on ubuntu-22.04, libstdc++ and libgcc linked statically; needs glibc 2.35 or newer (Ubuntu 22.04+, Debian 12+, Fedora 36+, SteamOS 3) and a Vulkan driver. Checked there by the converter and launcher checks; gameplay, graphics, sound and the microphone have not been tested on a real Linux PC yet." >> "$notes"
            fi
            echo >> "$notes"
          done
          echo 'Check the archives against SHA256SUMS before use; each manifest lists every file with its SHA-256 and every binary with the libraries it needs.' >> "$notes"
          (cd "$out" && sha256sum -- "${assets[@]##*/}" > SHA256SUMS)
          cat "$out/SHA256SUMS"
          tag="r$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT-${GITHUB_SHA::7}"
          joined=$(printf '%s, ' "${platforms[@]}")
          title="Gothic AI r$GITHUB_RUN_NUMBER, preliminary (${joined%, })"
          args=(--repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "$title" --notes-file "$notes")
          if [[ $RELEASE == draft ]]; then args+=(--draft); fi
          gh release create "$tag" "${args[@]}" "${assets[@]}" "$out/SHA256SUMS"
