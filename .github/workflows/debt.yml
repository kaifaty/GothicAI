name: Technical debt

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the plan without changing issues"
        type: boolean
        default: true
  pull_request:
    paths:
      - scripts/debt.py
      - scripts/debt.toml
      - .github/workflows/debt.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: debt-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_PYTHON: "3.12"
  PYTHONUNBUFFERED: "1"

jobs:
  debt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.4"
          enable-cache: true
          cache-dependency-glob: "scripts/debt.toml"
      - name: Reconcile technical debt
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
        run: |
          args=(sync)
          if [[ "$APPLY" == true ]]; then
            args+=(--apply)
          fi
          python3 scripts/debt.py "${args[@]}"
