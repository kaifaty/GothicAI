name: Technical debt ratchet

on: pull_request

permissions:
  contents: read

concurrency:
  group: debt-ratchet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  debt-ratchet:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Check debt growth
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Measure the PR tree with the base's ratchet: a branch older than the ratchet has no `check`.
          tool=$(mktemp -d)
          if git show "$BASE_SHA:scripts/debt.py" > "$tool/debt.py" 2> /dev/null \
              && git show "$BASE_SHA:scripts/debt.toml" > "$tool/debt.toml" 2> /dev/null \
              && python3 "$tool/debt.py" check --help > /dev/null 2>&1; then
            python3 "$tool/debt.py" check --base "$BASE_SHA"
          else
            echo "::warning title=Храповик техдолга::На базе PR в scripts/debt.py нет команды check; храповик пропущен."
          fi
      - name: Check engine layers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Only warns: forbidden includes the PR adds across the engine layers.
          tool=$(mktemp -d)
          if git show "$BASE_SHA:scripts/engine_layers.py" > "$tool/engine_layers.py" 2> /dev/null; then
            python3 "$tool/engine_layers.py" check --base "$BASE_SHA" \
              || echo "::warning title=Слои движка::Проверка слоёв упала; журнал шага выше."
          else
            echo "Слои движка: на базе PR ещё нет scripts/engine_layers.py; проверка пропущена."
          fi
